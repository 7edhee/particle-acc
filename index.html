<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Particle Accelerator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 300px;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #ddd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #00f0ff;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .stats {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Particle Accelerator</h1>
        <p>Click & drag to pull particles. Double click to create a supernova blast!</p>
        
        <div class="control-group">
            <label for="gravity">Gravity Force <span id="gravity-val">0.5</span></label>
            <input type="range" id="gravity" min="0.1" max="2" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <label for="friction">Space Friction <span id="friction-val">0.99</span></label>
            <input type="range" id="friction" min="0.90" max="0.999" step="0.001" value="0.99">
        </div>

        <div class="btn-group">
            <button id="reset-btn">Reset</button>
            <button id="burst-btn">Spawn +100</button>
        </div>

        <div class="stats">
            Particles: <span id="particle-count" style="color: #fff;">0</span>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const gravityInput = document.getElementById('gravity');
        const frictionInput = document.getElementById('friction');
        const gravityVal = document.getElementById('gravity-val');
        const frictionVal = document.getElementById('friction-val');
        const particleCountEl = document.getElementById('particle-count');
        const resetBtn = document.getElementById('reset-btn');
        const burstBtn = document.getElementById('burst-btn');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, isPressed: false };

        // Handle resize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.radius = Math.random() * 2 + 1;
                this.hue = Math.random() * 60 + 180; // Cyan to Purple range
                this.mass = this.radius;
            }

            update(gravity, friction) {
                // Gravity towards mouse
                if (mouse.isPressed && mouse.x !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const force = (gravity * 100) / (dist * 0.5);

                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                    
                    // Shift color towards red/orange near strong gravity
                    if (dist < 150) {
                        this.hue = (this.hue + 2) % 360;
                    }
                }

                // Apply physics
                this.vx *= friction;
                this.vy *= friction;
                this.x += this.vx;
                this.y += this.vy;

                // Screen bounce
                if (this.x < 0 || this.x > width) this.vx *= -0.8;
                if (this.y < 0 || this.y > height) this.vy *= -0.8;

                // Keep inside bounds
                this.x = Math.max(0, Math.min(width, this.x));
                this.y = Math.max(0, Math.min(height, this.y));
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                ctx.fill();
                ctx.shadowBlur = 0; // reset for performance
            }
        }

        // Initialize particles
        function init(count = 300) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        // Controls
        gravityInput.addEventListener('input', (e) => gravityVal.textContent = e.target.value);
        frictionInput.addEventListener('input', (e) => frictionVal.textContent = e.target.value);

        resetBtn.addEventListener('click', () => init(300));
        burstBtn.addEventListener('click', () => {
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(width / 2, height / 2));
            }
        });

        // Mouse Events
        window.addEventListener('mousedown', (e) => {
            mouse.isPressed = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseup', () => mouse.isPressed = false);

        // Double click blast effect
        window.addEventListener('dblclick', (e) => {
            particles.forEach(p => {
                const dx = p.x - e.clientX;
                const dy = p.y - e.clientY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const force = 500 / dist;
                p.vx += (dx / dist) * force;
                p.vy += (dy / dist) * force;
                p.hue = Math.random() * 40 + 10; // Flash red/gold
            });
        });

        // Animation Loop
        function animate() {
            // Trail effect using semi-transparent background
            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const gravity = parseFloat(gravityInput.value);
            const friction = parseFloat(frictionInput.value);

            particles.forEach(p => {
                p.update(gravity, friction);
                p.draw();
            });

            // Draw gravity well cursor
            if (mouse.isPressed) {
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 20, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            particleCountEl.textContent = particles.length;
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
